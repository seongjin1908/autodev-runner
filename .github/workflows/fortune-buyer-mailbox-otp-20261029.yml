name: One-shot buyer mailbox challenge review QA
on:
  push:
    branches: [test/fortune-buyer-mailbox-otp-20261029]
    paths:
      - .github/workflows/fortune-buyer-mailbox-otp-20261029.yml
  pull_request:
    paths:
      - .github/workflows/fortune-buyer-mailbox-otp-20261029.yml
permissions:
  contents: read
jobs:
  buyer-otp:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: seongjin1908/ddd-revenue-os
          ref: bc74051092cccad012421b42efec08a836886f33
          token: ${{ secrets.AUTODEV_REPO_TOKEN }}
          persist-credentials: false
          path: hub
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Buyer OTP, owner review and existing Partner Hub security tests
        working-directory: hub/partner-hub
        run: npm run check
      - name: Public enrolment and cash payout switches remain OFF
        working-directory: hub/partner-hub
        run: |
          grep -Fx 'PARTNER_REFERRALS_ENABLED=NO' .env.example
          grep -Fx 'ALLOW_MANUAL_PAYOUT=NO' .env.example
