name: One-shot local HTTP Fortune Partner Hub acceptance
on:
  push:
    branches: [test/fortune-hub-refund-20261029]
    paths:
      - .github/workflows/fortune-hub-business-journey-20261029.yml
  pull_request:
    paths:
      - .github/workflows/fortune-hub-business-journey-20261029.yml
permissions:
  contents: read
jobs:
  local-http-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: seongjin1908/ddd-revenue-os
          ref: b244dab72da4000c5c4ff1fc2f6ea015838e9e67
          token: ${{ secrets.AUTODEV_REPO_TOKEN }}
          persist-credentials: false
          path: hub
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete isolated Partner Hub regressions including real local HTTP
        working-directory: hub/partner-hub
        run: npm run check
      - name: Confirm no live partner sign-up, commission or payouts
        working-directory: hub/partner-hub
        run: |
          grep -Fx 'PARTNER_TERMS_APPROVED=NO' .env.example
          grep -Fx 'PARTNER_REFERRALS_ENABLED=NO' .env.example
          grep -Fx 'ALLOW_MANUAL_PAYOUT=NO' .env.example
          grep -F 'cashPayoutEnabled: false' integrations/appdeploy/fortune-affiliate.ts
          echo "All tests use synthetic HTTP on loopback. No new Railway services or real transactions."
