name: SajuMyeongkwae Isolated PDF Layout

on:
  pull_request:
    paths:
      - '.github/workflows/sajumyeongkwae-pdf-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saju-pdf-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check private source access
        env:
          REPO_TOKEN: ${{ secrets.AUTODEV_REPO_TOKEN }}
        run: test -n "$REPO_TOKEN"
      - name: Checkout immutable source for layout regression only
        uses: actions/checkout@v4
        with:
          repository: seongjin1908/daangn-saju-autodev
          ref: '598378d473659faaff2455abda9c2fe84767be57'
          token: ${{ secrets.AUTODEV_REPO_TOKEN }}
          path: target
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install existing dependencies without lifecycle hooks
        working-directory: target
        run: npm install --no-package-lock --no-audit --no-fund --ignore-scripts
      - name: Render calculated synthetic PDF fixtures, zero paid AI calls
        working-directory: target
        run: node scripts/check-unkive-pdf.mjs
      - name: Enforce original strict PDF retention, page and font checks
        working-directory: target
        run: |
          python -m pip install PyMuPDF==1.26.5
          python scripts/check-unkive-pdf-layout.py
