name: Coston AppDeploy isolated snapshot durability (read only)
on:
  push:
    branches: [test/coston-appdeploy-durability-20261028]
    paths:
      - .github/workflows/coston-appdeploy-durability-20261028.yml
permissions:
  contents: read
jobs:
  check-isolated-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated headless browser tools
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install chromium
      - name: Verify synthetic prior-snapshot DB through AppDeploy client SDK
        env:
          PROBE_URL: https://coston-p002-db-isolation-qa-2v599p.v2.appdeploy.ai/?mode=manual-persistence-qa&check=qa-p002-snapshot-readonly-d71c5e9a20261028
        run: |
          node <<'NODE'
          const {chromium} = require('playwright');
          (async () => {
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage();
              await page.goto(process.env.PROBE_URL,{waitUntil:'domcontentloaded'});
              await page.waitForFunction(() => {
                const text=document.querySelector('#result')?.textContent||'';
                return text.includes('"passed"') ||
                  text.includes('"status": "isolated_read_only_probe_failed"');
              },null,{timeout:30000});
              const text=await page.locator('#result').textContent();
              const report=JSON.parse(text);
              if (report.status === 'isolated_read_only_probe_failed') {
                throw new Error('AppDeploy SDK client probe failed');
              }
              const checks=Object.entries(report.checks||{});
              console.log('Synthetic cross-snapshot checks:',JSON.stringify(Object.fromEntries(checks)));
              if (checks.length!==6||checks.some(([,ok])=>ok!==true)||
                  report.passed!==true||report.readOnly!==true||
                  report.paymentProviderCalls!==0||report.bankTransfers!==0||
                  report.partnerHubCalls!==0) {
                throw new Error('Isolated cross-snapshot durability failed');
              }
              console.log('PASS: v8 synthetic chosen IDs/CAS/outbox readable after v9 archived snapshot and fresh read-only deployment');
            } finally {
              await browser.close();
            }
          })().catch(err=>{console.error(err.name+': '+err.message);process.exitCode=1;});
          NODE
      - name: Scope notice
        run: echo 'One headless read-only DB check only. No AppDeploy deploy, PayApp, bank, refund or Partner Hub POST.'
