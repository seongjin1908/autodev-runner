name: Control Plane Check

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'config/**'
      - 'scripts/**'
      - 'prompts/**'
      - 'README.md'
      - 'DEV_FACTORY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-plane-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project registry JSON
        run: python -m json.tool config/projects.json >/dev/null

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/*.sh; do
            bash -n "$file"
          done

      - name: Check guarded push for new and advanced remote refs
        shell: bash
        run: bash scripts/test_push_target.sh

      - name: Validate target registry invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          cfg = json.loads(Path("config/projects.json").read_text())
          projects = cfg.get("projects", [])
          required = {
              "alias", "repository", "work_branch", "base_branch",
              "validation", "prompt_file", "recent_change_guard_minutes",
              "max_changed_files", "auto_enabled", "auto_weight",
              "release_priority", "failure_hold_threshold", "failure_hold_minutes",
              "branch_mode", "max_branch_ahead",
          }

          aliases = set()
          for project in projects:
              missing = sorted(required - set(project))
              assert not missing, f"{project.get('alias', '<unknown>')}: missing {missing}"
              alias = project["alias"]
              assert alias not in aliases, f"duplicate alias: {alias}"
              aliases.add(alias)
              assert project["work_branch"] != project["base_branch"], f"{alias}: work branch equals base branch"
              assert project["branch_mode"] in {"fixed", "run_scoped"}, f"{alias}: invalid branch mode"
              assert int(project["max_branch_ahead"]) >= 0, f"{alias}: invalid max branch ahead"
              if project["branch_mode"] == "run_scoped":
                  assert project.get("source_branch"), f"{alias}: run-scoped target needs source_branch"
                  assert project["source_branch"] == project["base_branch"], f"{alias}: source_branch must equal PR base"
              assert Path(project["prompt_file"]).is_file(), f"{alias}: missing prompt {project['prompt_file']}"
              assert int(project["recent_change_guard_minutes"]) >= 0, f"{alias}: invalid guard"
              assert 1 <= int(project["max_changed_files"]) <= 100, f"{alias}: invalid file limit"
              assert int(project["auto_weight"]) >= 0, f"{alias}: invalid auto weight"
              assert 0 <= int(project["release_priority"]) <= 100, f"{alias}: invalid release priority"
              assert 1 <= int(project["failure_hold_threshold"]) <= 10, f"{alias}: invalid failure threshold"
              assert 5 <= int(project["failure_hold_minutes"]) <= 1440, f"{alias}: invalid failure hold"
              if project["auto_enabled"]:
                  assert int(project["auto_weight"]) > 0, f"{alias}: enabled target needs positive auto weight"

          rotation = cfg.get("auto_rotation", [])
          unknown = sorted(set(rotation) - aliases)
          assert not unknown, f"rotation references unknown aliases: {unknown}"
          assert rotation, "auto_rotation must not be empty"
          print(f"Validated {len(projects)} targets and {len(rotation)} rotation slots.")
          PY

      - name: Dry-run target selection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/aliases.txt
          import json
          cfg=json.load(open('config/projects.json'))
          for p in cfg['projects']:
              print(p['alias'])
          PY
          while IFS= read -r alias; do
            : > /tmp/github-output
            TARGET="$alias" GITHUB_OUTPUT=/tmp/github-output bash scripts/select_target.sh >/dev/null
            grep -q '^repository=' /tmp/github-output
            grep -q '^failure_hold_threshold=' /tmp/github-output
            grep -q '^checkout_branch=' /tmp/github-output
            grep -q '^branch_mode=' /tmp/github-output
          done < /tmp/aliases.txt
          : > /tmp/github-output
          TARGET=auto GITHUB_OUTPUT=/tmp/github-output bash scripts/select_target.sh >/dev/null
          grep -q '^alias=' /tmp/github-output
