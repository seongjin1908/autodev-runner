name: Coston merchant cursor safety independent regression
on:
  push:
    branches: [test/coston-checkpoint-safety-20261028]
    paths:
      - .github/workflows/coston-checkpoint-safety-20261028.yml
permissions:
  contents: read
jobs:
  merchant-cursor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: seongjin1908/daangn-saju-autodev
          ref: 39111ebced9c632eb139ecc130a06cfe3e051bb7
          token: ${{ secrets.AUTODEV_REPO_TOKEN }}
          persist-credentials: false
          path: merchant
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthetic merchant payment and affiliate cursor tests
        working-directory: merchant
        run: node --test tests/coston-p002-merchant-hook.test.mjs tests/coston-p002-paid-scan.test.mjs tests/coston-payapp-created-scan.test.mjs
      - name: Verify merchant and frontend affiliate defaults remain OFF
        working-directory: merchant
        run: |
          grep -F "const COSTON_P002_AFFILIATE_ENABLED = false;" backend/index.ts
          grep -F "const COSTON_P002_REFERRAL_CAPTURE_ENABLED = false;" src/App.tsx
          echo 'Synthetic tests only, no AppDeploy, PayApp, Railway or customer transactions.'
