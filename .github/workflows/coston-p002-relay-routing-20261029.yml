name: Coston P002 dedicated Relay routing safety regression
on:
  push:
    branches: [test/coston-p002-relay-routing-20261029]
    paths:
      - .github/workflows/coston-p002-relay-routing-20261029.yml
permissions:
  contents: read
jobs:
  merchant-relay-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: seongjin1908/daangn-saju-autodev
          ref: 592d38e29c55c387302aa13b3c4cabc1b45bfa9c
          token: ${{ secrets.AUTODEV_REPO_TOKEN }}
          persist-credentials: false
          path: merchant
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline P002 routing and independent PayApp contract test suite
        working-directory: merchant
        run: |
          node --test tests/saju-p002-relay.test.mjs tests/coston-p002-relay-routing.test.mjs tests/coston-payapp-relay-preflight.test.mjs tests/coston-payapp-recovery-observability.test.mjs tests/coston-p002-merchant-hook.test.mjs tests/coston-p002-paid-scan.test.mjs tests/coston-payapp-created-scan.test.mjs
      - name: Syntax and affiliate OFF guard
        working-directory: merchant
        run: |
          node --check relay/saju-p002/server.mjs
          node --check relay/saju-p002/store-s3.mjs
          node --check relay/saju-p002/contract.mjs
          node --check backend/coston-p002-relay-routing.mjs
          grep -F 'const COSTON_P002_AFFILIATE_ENABLED = false;' backend/index.ts
          grep -F 'const COSTON_P002_REFERRAL_CAPTURE_ENABLED = false;' src/App.tsx
          echo 'Only synthetic local mocks; no live PayApp or Railway changes.'
