name: Coston Saju Premium P002 durable outbox independent regression
on:
  push:
    branches: [test/coston-saju-outbox-20261028]
    paths:
      - .github/workflows/coston-saju-outbox-20261028.yml
      - config/coston-saju-outbox-20261028.txt
permissions:
  contents: read
jobs:
  safe-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: seongjin1908/daangn-saju-autodev
          ref: 10c88b58c100ddf3c6660457b6fb06f218e3a937
          token: ${{ secrets.AUTODEV_REPO_TOKEN }}
          persist-credentials: false
          path: saju
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test P002 verified PayApp and durable outbox with crash/replay/concurrency
        working-directory: saju
        run: node --test tests/saju-p002-payapp-bridge.test.mjs tests/saju-p002-durable-outbox.test.mjs
      - name: Existing affiliate ledger and merchant proof guard regressions
        working-directory: saju
        run: node --test tests/affiliate-ledger.test.mjs tests/affiliate-payment-guard.test.mjs
      - name: Strict no real payments or deployments
        run: echo 'Source-only synthetic validation. No AppDeploy, Railway, PayApp or Hub network.'
