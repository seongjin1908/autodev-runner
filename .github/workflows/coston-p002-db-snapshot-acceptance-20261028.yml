name: Coston P002 isolated database cross-snapshot acceptance
on:
  push:
    branches: [test/coston-p002-db-snapshot-acceptance-20261028]
    paths:
      - .github/workflows/coston-p002-db-snapshot-acceptance-20261028.yml
permissions:
  contents: read
jobs:
  isolated-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser (one-time test)
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install chromium
      - name: Verify exact synthetic durable receipt on isolated app
        env:
          QA_MODE: seed
          QA_URL: https://coston-p002-db-isolation-qa-2v599p.v2.appdeploy.ai/
          QA_KEY: qa-20261028-commit-test-2c7f0a91d543f8b6
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage();
              const url=new URL(process.env.QA_URL);
              url.searchParams.set('qa_mode',process.env.QA_MODE);
              url.searchParams.set('qa_key',process.env.QA_KEY);
              await page.goto(url.toString(),{waitUntil:'domcontentloaded'});
              await page.waitForFunction(() => {
                const s=document.querySelector('#result')?.textContent||'';
                return s.includes('"writerCommitted"') ||
                  s.includes('"sdkRevision"') ||
                  s.includes('"passed": false');
              },null,{timeout:30000});
              const report=JSON.parse(await page.locator('#result').textContent());
              console.log('Synthetic QA result:',JSON.stringify(report));
              if(report.passed!==true||
                  report.checks?.order!==true||
                  report.checks?.event!==true||
                  report.checks?.cursor!==true||
                  report.readOnly!==true||
                  report.providerCalls!==0||report.hubCalls!==0||
                  report.moneyTransfers!==0||
                  (process.env.QA_MODE==='seed'&&report.writerCommitted!==true)){
                throw new Error('Isolated persistent receipt checkpoint acceptance failed');
              }
              console.log('PASS: bounded synthetic '+process.env.QA_MODE+' database check');
            } finally {
              await browser.close();
            }
          })().catch(err=>{console.error(err.name+': '+err.message);process.exitCode=1;});
          NODE
      - name: Safety note
        run: echo 'No customer orders, real provider payments, affiliate releases, refunds or bank payouts.'
