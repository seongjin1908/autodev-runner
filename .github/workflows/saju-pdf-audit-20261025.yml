name: Saju approved one-time 96 PDF audit

on:
  push:
    branches:
      - qa/saju-pdf-audit-20261025
    paths:
      - .github/workflows/saju-pdf-audit-20261025.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf-audit:
    name: Pinned 24 charts x 4 products physical PDF audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact reviewed release source
        uses: actions/checkout@v4
        with:
          repository: seongjin1908/daangn-saju-autodev
          ref: bcc533a986c6a3c53ff0cb5d6e062cc18ecba4f7
          token: ${{ secrets.AUTODEV_REPO_TOKEN }}
          path: target
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies without lifecycle scripts
        working-directory: target
        run: npm install --no-package-lock --no-audit --no-fund --ignore-scripts
      - name: Audit all 24-by-4 report compositions
        working-directory: target
        run: |
          mkdir -p release-test-results
          npx --no-install esbuild scripts/unkive-report-composition-check.ts --bundle --platform=node --format=cjs --packages=external --alias:@appdeploy/sdk=./scripts/test-backend-sdk.ts --outfile=release-test-results/report-composition.cjs
          node -e "require('./release-test-results/report-composition.cjs').reportCompositionCheck().catch(e => { console.error(e); process.exitCode=1; })"
      - name: Render actual 96 synthetic PDFs
        working-directory: target
        run: node scripts/check-unkive-pdf-matrix.mjs
      - name: Inspect PDF text, layout and bookmarks
        working-directory: target
        run: |
          python -m pip install --disable-pip-version-check PyMuPDF==1.26.5
          python scripts/check-unkive-pdf-matrix.py
      - name: Upload PDF audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saju-approved-pinned-96-pdf-audit
          path: |
            target/release-test-results/pdf-matrix/inspection.json
            target/release-test-results/pdf-matrix/manifest.json
            target/release-test-results/pdf-matrix/premium-repetition-audit.json
            target/release-test-results/report-composition-review.json
            target/release-test-results/pdf-matrix/00-P001.pdf
            target/release-test-results/pdf-matrix/00-P002.pdf
            target/release-test-results/pdf-matrix/00-P005.pdf
            target/release-test-results/pdf-matrix/00-P004.pdf
            target/release-test-results/pdf-matrix/23-P004.pdf
          if-no-files-found: warn
          retention-days: 7
