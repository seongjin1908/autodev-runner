name: REA Codex MCP smoke (no AI calls)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rea-codex-mcp-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rea-codex-mcp-smoke
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      REA_VERSION: '6.5.0'
      npm_config_ignore_scripts: 'true'
    steps:
      - name: Set up Node LTS with REA compatible version
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Create ephemeral isolated Codex HOME
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codex-home"
          echo "CODEX_HOME=$RUNNER_TEMP/codex-home" >> "$GITHUB_ENV"
      - name: Install Codex CLI and REA fixed versions
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/rea-tools" --no-package-lock --no-save --ignore-scripts @openai/codex rea-agents@6.5.0
          echo "$RUNNER_TEMP/rea-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Register REA MCP in temporary Codex profile
        shell: bash
        run: |
          set -euo pipefail
          codex --version
          codex mcp add rea -- npx -y rea-agents@6.5.0 mcp
          codex mcp list
          codex mcp get rea
          grep -F '[mcp_servers.rea]' "$CODEX_HOME/config.toml"
          grep -F 'rea-agents@6.5.0' "$CODEX_HOME/config.toml"
      - name: Align registration with REA official scoped setup
        shell: bash
        run: |
          set -euo pipefail
          rea setup --yes --client codex --skill=false --json > "$RUNNER_TEMP/rea-setup.json"
          node -e 'const fs=require("node:fs");const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));console.log("REA_SETUP_STATUS",d.status||"available");' "$RUNNER_TEMP/rea-setup.json"
          codex mcp get rea
      - name: Diagnose Codex registration (capture missing optional engines)
        shell: bash
        run: |
          set -euo pipefail
          status=0
          rea doctor --client codex --json > "$RUNNER_TEMP/doctor.json" || status=$?
          node - "$RUNNER_TEMP/doctor.json" "$status" <<'NODE'
          const fs = require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log('REA_DOCTOR_SCOPE',JSON.stringify({scope:d.scope,healthy:d.healthy,environment_healthy:d.environment_healthy,scope_checks:d.scope_checks}).slice(0,4000));
          console.log('REA_DOCTOR_EXIT',process.argv[3]);
          NODE
          echo "Codex MCP entry registered; doctor diagnostics captured. A missing optional native provider is not proof of MCP failure." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify REA MCP initialize and tool discovery without a model call
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {spawn} = require('node:child_process');
          const proc = spawn('npx',['-y','rea-agents@6.5.0','mcp'], {env:process.env,stdio:['pipe','pipe','pipe']});
          let buffer='', errors='', complete=false;
          const timer=setTimeout(()=>finish(new Error('MCP initialization timeout')),30000);
          proc.stderr.on('data',d=>{errors=(errors+String(d)).slice(-2000)});
          function finish(error) {
            if(complete)return;complete=true;clearTimeout(timer);proc.kill();
            if(error){console.error('REA_MCP_FAIL',error.message,errors);process.exitCode=1}
            else{console.log('REA_MCP_INITIALIZE_AND_TOOLS_PASS');process.exitCode=0}
          }
          function send(m){proc.stdin.write(JSON.stringify(m)+'\n')}
          proc.on('error',finish);
          proc.on('exit',code=>{if(!complete)finish(new Error('MCP exited before tool discovery: '+code))});
          proc.stdout.on('data',chunk=>{
            buffer+=String(chunk);
            let index;
            while((index=buffer.indexOf('\n'))!==-1){
              const line=buffer.slice(0,index).trim();buffer=buffer.slice(index+1);
              if(!line)continue;
              let value;try{value=JSON.parse(line)}catch{continue}
              if(value.id===1) {
                if(value.error||!value.result)return finish(new Error('MCP initialize rejected'));
                send({jsonrpc:'2.0',method:'notifications/initialized'});
                send({jsonrpc:'2.0',id:2,method:'tools/list',params:{}});
              }
              if(value.id===2){
                if(value.error||!Array.isArray(value.result?.tools)||value.result.tools.length<1)return finish(new Error('MCP tools/list returned no tools'));
                console.log('REA_MCP_TOOLS_COUNT',value.result.tools.length);
                return finish();
              }
            }
          });
          send({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2025-03-26',capabilities:{},clientInfo:{name:'rea-github-no-ai-smoke',version:'1.0.0'}}});
          NODE
