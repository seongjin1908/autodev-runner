name: Independent Portfolio Release Candidate Check

on:
  pull_request:
    paths:
      - '.github/workflows/portfolio-release-candidate-ci.yml'
  workflow_dispatch:
  # Public central runner validates current non-saju main snapshots and selected pinned PRs
  # when hosted jobs inside private product repos cannot start.
  schedule:
    - cron: '13 3 * * *'

permissions:
  contents: read

concurrency:
  group: portfolio-release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify ${{ matrix.case }}
    # A fork PR must never obtain the private-product checkout credential.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: face-lab
            repo: seongjin1908/face-lab-global
            ref: main
            case: face-lab-main
          - target: pricecam
            repo: seongjin1908/pricecam-autodev
            ref: main
            case: pricecam-main
          - target: second
            repo: seongjin1908/second-work
            ref: main
            case: second-main
          - target: fault-intel
            repo: seongjin1908/fault-intelligence
            ref: main
            case: fault-intel-main
          - target: worklink
            repo: seongjin1908/worklink
            ref: main
            case: worklink-main
          - target: restore-ai
            repo: seongjin1908/restore-ai-autodev
            ref: main
            case: restore-ai-main
          - target: cyber-guardian
            repo: seongjin1908/cyber-guardian-ai
            ref: main
            case: cyber-guardian-main
          - target: restore-ai
            repo: seongjin1908/restore-ai-autodev
            ref: a0603343626ea3d6e59ad4e5259ed1cb8e150853
            case: restore-ai-pr19

    steps:
      - name: Require trusted repository token
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.AUTODEV_REPO_TOKEN }}
        run: |
          if [ -z "$REPO_TOKEN" ]; then
            echo "::error::Private source checkout cannot run without AUTODEV_REPO_TOKEN"
            exit 1
          fi

      - name: Checkout immutable existing product snapshot
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          # Main snapshots are always current; PR comparisons are immutable
          # owner-reviewed SHAs. Never check out arbitrary event refs.
          ref: ${{ matrix.ref }}
          token: ${{ secrets.AUTODEV_REPO_TOKEN }}
          persist-credentials: false

      - name: Record exact checkout commit for reproducibility
        shell: bash
        run: |
          set -euo pipefail
          echo "Case: \`${{ matrix.case }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked source SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install product source dependencies without lifecycle scripts
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "cyber-guardian" ]; then
            echo "Defensive project uses Node.js built-ins; no dependency install necessary"
            exit 0
          fi
          if [ "$TARGET" = "restore-ai" ]; then
            if ! npm ci --no-audit --no-fund >/tmp/portfolio-private-install.log 2>&1; then
              echo "::error::Dependency bootstrap failed for $TARGET (private diagnostics withheld)."
              exit 1
            fi
          elif [ -f package-lock.json ]; then
            if ! npm ci --no-audit --no-fund --ignore-scripts >/tmp/portfolio-private-install.log 2>&1; then
              echo "::error::Dependency bootstrap failed for $TARGET (private diagnostics withheld)."
              exit 1
            fi
          else
            if ! npm install --no-package-lock --no-audit --no-fund --ignore-scripts >/tmp/portfolio-private-install.log 2>&1; then
              echo "::error::Dependency bootstrap failed for $TARGET (private diagnostics withheld)."
              exit 1
            fi
          fi
          echo "PASS: dependencies installed without public private-project logs."

      - name: Run existing deterministic product checks
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          # Tests run inside the isolated trusted checkout. Keep proprietary
          # source excerpts, fixtures and environment diagnostics out of this
          # public runner's logs; publish only the phase and fixed failure code.
          check() {
            local label="$1"
            shift
            if "$@" >/tmp/portfolio-private-check.log 2>&1; then
              echo "PASS: $TARGET/$label"
              return 0
            fi
            local issue="product_validation_failed"
            if grep -Eq 'error TS[0-9]{4}:' /tmp/portfolio-private-check.log; then
              issue="typescript_diagnostics"
            elif grep -Eqi '(npm ERR!|MODULE_NOT_FOUND|Cannot find module)' /tmp/portfolio-private-check.log; then
              issue="module_or_dependency_unavailable"
            elif grep -Eqi '(assertionerror|expected|not ok |failed tests)' /tmp/portfolio-private-check.log; then
              issue="test_assertion_failed"
            fi
            echo "::error::$TARGET/$label failed ($issue); private product logs withheld."
            exit 1
          }
          case "$TARGET" in
            face-lab)
              # Manifest is a manual-journey inventory, not proof of browser E2E.
              check test-manifest node -e "const t=require('./tests/tests.json'); if (!Array.isArray(t)||t.length===0) process.exit(1)"
              check typecheck npx --no-install tsc --noEmit
              check build npm run build
              ;;
            pricecam)
              check tests npm test
              check typecheck npm run typecheck
              check build npm run build
              ;;
            second)
              check tests npm test
              check typecheck npm run typecheck
              check build npm run build
              ;;
            fault-intel)
              check checks npm run check
              ;;
            worklink)
              check tests npm test
              check typecheck npm run typecheck
              check build npm run build
              ;;
            restore-ai)
              check checks npm run check
              ;;
            cyber-guardian)
              check syntax-guardian node --check guardian.js
              check syntax-policy node --check guard-policy.js
              check syntax-runtime node --check gateway/runtime.js
              check syntax-server node --check gateway/server.js
              check defensive-tests bash -lc 'node --test tests/*.test.js'
              if grep -qE 'fetch[(]|XMLHttpRequest|WebSocket[(]|node:child_process|node:net|exec[(]|spawn[(]' guardian.js guard-policy.js; then
                echo "::error::Unexpected networking or process-execution capability in defensive engine"
                exit 1
              fi
              ;;
            *)
              echo "::error::Unrecognized launch candidate"
              exit 2
              ;;
          esac

      - name: Report actual proof scope
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.target }} — immutable private-source checks"
            echo "- Repository: \`${{ matrix.repo }}\`"
            echo "- Selected reviewed ref: \`${{ matrix.ref }}\`"
            echo "- Build/test result is recorded in job steps; no paid AI or production credentials are provided."
            echo "- This does NOT prove real customer checkout, photo quality, licensing, real-data accuracy or browser E2E."
          } >> "$GITHUB_STEP_SUMMARY"
