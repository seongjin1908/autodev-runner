name: WORKLINK private PR candidate validation

# Execute from public zero-budget control plane without publishing private source.
# Only audited owner-controlled refs. No untrusted PR code or production effects.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worklink-private-baseline.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/worklink-private-baseline.yml'

permissions:
  contents: read

concurrency:
  group: worklink-private-baseline
  cancel-in-progress: false

jobs:
  verify-private-baseline:
    # Only owner-controlled branches may access the secret needed for private checkout.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify access token was configured
        shell: bash
        env:
          TARGET_TOKEN: ${{ secrets.AUTODEV_REPO_TOKEN }}
        run: |
          if [ -z "$TARGET_TOKEN" ]; then
            echo "::error::Central runner token is missing. Configure AUTODEV_REPO_TOKEN for private WORKLINK access."
            exit 10
          fi
          echo "Central token present; target access will be checked by checkout."

      - name: Checkout immutable WORKLINK source (private)
        uses: actions/checkout@v4
        with:
          repository: seongjin1908/worklink
          ref: 9585339dc417f880b6d4526a07bf92dc6a6f9c63
          token: ${{ secrets.AUTODEV_REPO_TOKEN }}
          persist-credentials: false
          path: target
          fetch-depth: 1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify immutable WORKLINK PR #9 source
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9585339dc417f880b6d4526a07bf92dc6a6f9c63"
          echo "WORKLINK source reference verified."

      - name: Install baseline dependencies
        shell: bash
        working-directory: target
        run: |
          if ! npm install --no-audit --no-fund --no-progress >/tmp/wl-install.log 2>&1; then
            echo "::error::WORKLINK npm bootstrap failed; no private install logs published."
            exit 11
          fi
          echo "WORKLINK dependency bootstrap succeeded."

      - name: TypeScript check
        shell: bash
        working-directory: target
        run: |
          if ! npm run typecheck >/tmp/wl-ts.log 2>&1; then
            echo "::error::WORKLINK TypeScript check failed; no private source diagnostics published."
            exit 12
          fi
          echo "TypeScript PASS"

      - name: Run contract checks
        shell: bash
        working-directory: target
        run: |
          if ! npm test >/tmp/wl-test.log 2>&1; then
            echo "::error::WORKLINK contract check failed; no private test data published."
            exit 13
          fi
          echo "Contract PASS"

      - name: Build application
        shell: bash
        working-directory: target
        run: |
          if ! npm run build >/tmp/wl-build.log 2>&1; then
            echo "::error::WORKLINK build failed; no proprietary build diagnostics published."
            exit 14
          fi
          echo "Build PASS"

      - name: Confirm independently validated candidate
        shell: bash
        run: |
          echo "WORKLINK latest open PR #9 candidate (NOT merged): 9585339dc417f880b6d4526a07bf92dc6a6f9c63" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable WORKLINK PR #9 dependency bootstrap, TypeScript, contract and Vite build PASS only when every prior step succeeds." >> "$GITHUB_STEP_SUMMARY"
          echo "No SMS, live payments, real jobs, user accounts, private user data, or production deployment was attempted. Product repository CI failure is NOT treated as passing." >> "$GITHUB_STEP_SUMMARY"
