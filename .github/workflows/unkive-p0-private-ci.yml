name: UNKIVE P0 private source verification

on:
  pull_request:
    paths:
      - '.github/workflows/unkive-p0-private-ci.yml'
      - 'config/unkive-p0-ci-ref.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unkive-p0-private-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout runner control plane
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate immutable target SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          ref="$(tr -d '\r\n' < config/unkive-p0-ci-ref.txt)"
          if ! [[ "$ref" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::P0 verification requires a pinned 40-character commit SHA."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Validating immutable UNKIVE source ref: $ref"

      - name: Check private repository access
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.AUTODEV_REPO_TOKEN }}
        run: |
          if [ -z "$REPO_TOKEN" ]; then
            echo "::error::Private checkout credential not configured."
            exit 1
          fi

      - name: Checkout UNKIVE private commit read-only
        uses: actions/checkout@v4
        with:
          repository: seongjin1908/daangn-saju-autodev
          ref: ${{ steps.target.outputs.ref }}
          token: ${{ secrets.AUTODEV_REPO_TOKEN }}
          path: target
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install existing project dependencies (no lifecycle hooks)
        working-directory: target
        run: npm install --no-package-lock --no-audit --no-fund --ignore-scripts

      - name: Verify production contract and TypeScript
        working-directory: target
        run: |
          node scripts/production-contract-check.mjs
          npx --no-install tsc --noEmit

      - name: Verify backend bundle
        working-directory: target
        run: npx --no-install esbuild backend/index.ts --bundle --platform=node --format=esm --packages=external --outfile=/tmp/unkive-private-p0.mjs

      - name: Verify isolated release bundle
        working-directory: target
        run: npx --no-install vite build --config scripts/vite-release-test.mjs

      - name: Install isolated browser test dependencies
        working-directory: target
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Paid personalization, question specificity, and mobile browser journey
        working-directory: target
        run: |
          node scripts/check-unkive-free-editorial.mjs > /tmp/scoped-check.log 2>&1 || { tail -c 3000 /tmp/scoped-check.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
          node scripts/check-unkive-paid-quality.mjs > /tmp/scoped-check.log 2>&1 || { tail -c 3000 /tmp/scoped-check.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
          node scripts/check-unkive-personalization.mjs > /tmp/scoped-check.log 2>&1 || { tail -c 3000 /tmp/scoped-check.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
          node scripts/check-unkive-paid-ai-context.mjs > /tmp/scoped-check.log 2>&1 || { tail -c 3000 /tmp/scoped-check.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
          node scripts/check-unkive-content-review.mjs > /tmp/scoped-check.log 2>&1 || { tail -c 3000 /tmp/scoped-check.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
          node scripts/check-unkive-payapp-vbank.mjs > /tmp/scoped-check.log 2>&1 || { tail -c 3000 /tmp/scoped-check.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
          node scripts/check-unkive-pdf.mjs > /tmp/scoped-check.log 2>&1 || { tail -c 3000 /tmp/scoped-check.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
          node scripts/check-unkive-monthly-guidance.mjs
          node scripts/unkive-personalization-e2e.mjs
          node scripts/unkive-home-e2e.mjs > /tmp/scoped-check.log 2>&1 || { tail -c 3000 /tmp/scoped-check.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
          node scripts/check-unkive-calculation.mjs
          node scripts/check-unkive-delivery.mjs
          node scripts/unkive-release-e2e.mjs > /tmp/release-e2e.log 2>&1 || { tail -c 3000 /tmp/release-e2e.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }

      - name: Retain synthetic content review outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unkive-content-review-24-synthetic
          retention-days: 7
          path: |
            target/release-test-results/content-review.json
            target/release-test-results/content-review.md
