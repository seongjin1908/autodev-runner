name: SajuMyeongkwae 12 fixed-question editorial comparison
on:
  pull_request:
    paths:
      - .github/workflows/unkive-release12.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-twelve:
    name: ${{ matrix.version.label }} same twelve Q1 / four tiers
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        version:
          - label: baseline
            ref: da9cf033eee27db3b2c32c1587df063f23a63717
          - label: candidate
            ref: 117d9b29334258b6f4c36da44e28a5060242d9f6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned private analysis code read-only
        uses: actions/checkout@v4
        with:
          repository: seongjin1908/daangn-saju-autodev
          ref: ${{ matrix.version.ref }}
          token: ${{ secrets.AUTODEV_REPO_TOKEN }}
          path: target
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install existing dependencies without lifecycle scripts
        working-directory: target
        run: npm install --no-package-lock --no-audit --no-fund --ignore-scripts
      - name: Generate fixed 12 chart / question snapshots without model calls
        working-directory: target
        run: |
          mkdir -p release-test-results
          npx --no-install esbuild scripts/unkive-release12-content-check.ts --bundle --platform=node --format=cjs --packages=external --alias:@appdeploy/sdk=./scripts/test-backend-sdk.ts --outfile=release-test-results/release12.cjs
          node release-test-results/release12.cjs
      - name: Test real paid AI prompt routing with local SDK stub
        if: matrix.version.label == 'candidate'
        working-directory: target
        run: |
          npx --no-install tsc -p scripts/tsconfig-paid-ai-context.json
          npx --no-install esbuild scripts/unkive-paid-ai-context-check.ts --bundle --platform=node --format=cjs --packages=external --alias:@appdeploy/sdk=./scripts/test-backend-sdk.ts --outfile=release-test-results/paid-ai-context.cjs
          node release-test-results/paid-ai-context.cjs
      - name: Verify all 24 by 4 customer paragraphs without PDF regeneration
        if: matrix.version.label == 'candidate'
        working-directory: target
        run: |
          npx --no-install esbuild scripts/unkive-report-composition-check.ts --bundle --platform=node --format=cjs --packages=external --alias:@appdeploy/sdk=./scripts/test-backend-sdk.ts --outfile=release-test-results/report-composition.cjs
          node -e "require('./release-test-results/report-composition.cjs').reportCompositionCheck().catch(e => { console.error(e); process.exitCode=1; })"
      - name: Verify mock payment terminal state and same-order PDF re-entry
        if: matrix.version.label == 'candidate'
        working-directory: target
        run: |
          node scripts/check-unkive-order-resume.mjs
          node scripts/check-unkive-backend-recovery.mjs
      - name: Retain exact same-case customer report text
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saju-release12-${{ matrix.version.label }}
          path: target/release-test-results/release12-content.json
          if-no-files-found: ignore
          retention-days: 7

  release-candidate-96-pdf:
    name: Frozen candidate 24 charts x 4 actual PDF render and inspection
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact frozen source without write credentials
        uses: actions/checkout@v4
        with:
          repository: seongjin1908/daangn-saju-autodev
          ref: 117d9b29334258b6f4c36da44e28a5060242d9f6
          token: ${{ secrets.AUTODEV_REPO_TOKEN }}
          path: target
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install existing dependencies without lifecycle scripts
        working-directory: target
        run: npm install --no-package-lock --no-audit --no-fund --ignore-scripts
      - name: Inspect full 24-by-4 report composition from the actual source
        working-directory: target
        run: |
          mkdir -p release-test-results
          npx --no-install esbuild scripts/unkive-report-composition-check.ts --bundle --platform=node --format=cjs --packages=external --alias:@appdeploy/sdk=./scripts/test-backend-sdk.ts --outfile=release-test-results/report-composition.cjs
          node -e "require('./release-test-results/report-composition.cjs').reportCompositionCheck().catch(e => { console.error(e); process.exitCode=1; })"
      - name: Render exactly 96 synthetic PDFs with existing Korean fonts
        working-directory: target
        run: node scripts/check-unkive-pdf-matrix.mjs
      - name: Verify all 96 rendered PDF text, page layout and bookmarks
        working-directory: target
        run: |
          python -m pip install --disable-pip-version-check PyMuPDF==1.26.5
          python scripts/check-unkive-pdf-matrix.py
      - name: Retain human-reviewable PDF sample and complete inspection record
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saju-candidate-96-pdf-audit
          path: |
            target/release-test-results/pdf-matrix/inspection.json
            target/release-test-results/pdf-matrix/manifest.json
            target/release-test-results/pdf-matrix/premium-repetition-audit.json
            target/release-test-results/report-composition-review.json
            target/release-test-results/pdf-matrix/00-P001.pdf
            target/release-test-results/pdf-matrix/00-P002.pdf
            target/release-test-results/pdf-matrix/00-P005.pdf
            target/release-test-results/pdf-matrix/00-P004.pdf
            target/release-test-results/pdf-matrix/23-P004.pdf
          if-no-files-found: ignore
          retention-days: 7
