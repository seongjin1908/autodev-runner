name: One-shot Fortune provisional commissions isolated QA
on:
  push:
    branches: [test/fortune-provisional-20261029]
    paths:
      - .github/workflows/fortune-provisional-20261029.yml
  pull_request:
    paths:
      - .github/workflows/fortune-provisional-20261029.yml
permissions:
  contents: read
jobs:
  hub-provisional-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: seongjin1908/ddd-revenue-os
          ref: badcba2f16ca244b1510c79b96cc15cc884531dc
          token: ${{ secrets.AUTODEV_REPO_TOKEN }}
          persist-credentials: false
          path: hub
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All Hub security and local HTTP tests including provisional unverified sales
        working-directory: hub/partner-hub
        run: npm run check
      - name: Prove public referral and cash payout remain hard disabled
        working-directory: hub/partner-hub
        run: |
          grep -Fx 'PARTNER_TERMS_APPROVED=NO' .env.example
          grep -Fx 'PARTNER_REFERRALS_ENABLED=NO' .env.example
          grep -Fx 'ALLOW_MANUAL_PAYOUT=NO' .env.example
