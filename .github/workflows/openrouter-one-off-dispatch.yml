name: One-off user-requested PriceCam free coding dispatch
on:
  push:
    branches: [test/openrouter-free-smoke-20261020]
    paths: [.github/workflows/openrouter-one-off-dispatch.yml]
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger only one explicitly opted-in PriceCam free-code batch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')"
          if [[ "$current" != "4a70996e60a38aa8d94bad442412900d61beadce" ]]; then
            echo "::error::Main has changed since tested manual opt-in; refusing unattended dispatch."
            exit 2
          fi
          # GitHub workflow_dispatch triggers a single manual action. This branch
          # does not deploy, enable cron, change repository variables or touch Saju.
          gh api --method POST "repos/$GH_REPO/actions/workflows/autodev.yml/dispatches" \
            -f "ref=main" \
            -f "inputs[target]=pricecam" \
            -f "inputs[openrouter_free_once]=true" >/dev/null
          echo "PASS: dispatched one PriceCam run with free OpenRouter manual opt-in."
