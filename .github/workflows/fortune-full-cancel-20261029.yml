name: One-shot Fortune signed cancellation QA
on:
  push:
    branches: [test/fortune-full-cancel-20261029]
    paths:
      - .github/workflows/fortune-full-cancel-20261029.yml
  pull_request:
    paths:
      - .github/workflows/fortune-full-cancel-20261029.yml
permissions:
  contents: read
jobs:
  isolated-cancellation-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: seongjin1908/ddd-revenue-os
          ref: e3cbe755cc221d2dffbdb4f753404604bb3db9c5
          token: ${{ secrets.AUTODEV_REPO_TOKEN }}
          persist-credentials: false
          path: hub
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full synthetic security and full cancellation regression
        working-directory: hub/partner-hub
        run: npm run check
      - name: Ensure payouts and enrollment remain disabled
        working-directory: hub/partner-hub
        run: |
          grep -Fx 'PARTNER_TERMS_APPROVED=NO' .env.example
          grep -Fx 'PARTNER_REFERRALS_ENABLED=NO' .env.example
          grep -Fx 'ALLOW_MANUAL_PAYOUT=NO' .env.example
