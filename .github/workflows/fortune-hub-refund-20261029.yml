name: One-shot Fortune Hub refund and signed referral QA
on:
  push:
    branches: [test/fortune-hub-refund-20261029]
    paths:
      - .github/workflows/fortune-hub-refund-20261029.yml
  pull_request:
    paths:
      - .github/workflows/fortune-hub-refund-20261029.yml
permissions:
  contents: read
jobs:
  hub-refund-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: seongjin1908/ddd-revenue-os
          ref: dcf27937263d6e62d3322983ddab32af5edec849
          token: ${{ secrets.AUTODEV_REPO_TOKEN }}
          persist-credentials: false
          path: hub
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all isolated affiliate engine + Fortune refund regressions
        working-directory: hub/partner-hub
        run: npm run check
      - name: Confirm production referral & payouts default OFF
        working-directory: hub/partner-hub
        run: |
          grep -F 'PARTNER_REFERRALS_ENABLED=NO' .env.example
          grep -F 'ALLOW_MANUAL_PAYOUT=NO' .env.example
          grep -F 'cashPayoutEnabled: false' integrations/appdeploy/fortune-affiliate.ts
          echo 'GitHub synthetic tests only. No payment, bank transfer or provider calls.'
