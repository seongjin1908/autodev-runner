name: Restore AI OSS Private Integration Check

on:
  pull_request:
    paths:
      - '.github/workflows/restore-oss-private-ci.yml'
      - 'config/restore-oss-ci-ref.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-oss-private-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require immutable pinned source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n' < config/restore-oss-ci-ref.txt)"
          if ! [[ "$sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Source must be a pinned immutable 40-character SHA"
            exit 2
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Require private checkout credential
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.AUTODEV_REPO_TOKEN }}
        run: |
          if [ -z "$REPO_TOKEN" ]; then
            echo "::error::The existing read-only checkout credential is unavailable"
            exit 1
          fi

      - name: Checkout Restore AI proposed commit
        uses: actions/checkout@v4
        with:
          repository: seongjin1908/restore-ai-autodev
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.AUTODEV_REPO_TOKEN }}
          path: target
          persist-credentials: false
          fetch-depth: 1

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test OSS adapters without external providers, weights or billing
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/oss_image_cli.py scripts/oss_image_cli_test.py
          python scripts/oss_image_cli_test.py

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install locked dependencies
        working-directory: target
        run: npm ci --no-audit --no-fund

      - name: Full Restore AI baseline with OSS tests
        working-directory: target
        run: npm run check

      - name: Offline pinned-Wrangler private staging dry-run
        working-directory: target
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
          RESTORE_STAGING_D1_ID: '12345678-1234-4123-8123-123456789abc'
          RESTORE_STAGING_PUBLIC_ORIGIN: 'https://restore-ai-private-staging.example.workers.dev'
          RESTORE_STAGING_TEAM_DOMAIN: 'https://restore-test.cloudflareaccess.com'
          RESTORE_STAGING_ACCESS_AUD: 'abcdefghijklmnopqrstuvwxyz123456'
        run: |
          set -euo pipefail
          # Synthetic resource IDs, no Cloudflare auth, no remote write/provider use.
          npm run staging:preflight
          npm run staging:prepare
          node scripts/validate_staging_deploy_config.mjs
          node --input-type=module -e 'import{readFileSync}from"node:fs";const c=JSON.parse(readFileSync("wrangler.staging.jsonc","utf8"));if(c.preview_urls!==false||c.vars.DEMO_MODE!=="true"||c.vars.DAILY_AI_BUDGET_KRW!=="0")process.exit(2)'
          tool_dir="$RUNNER_TEMP/restore-ci-staging-wrangler"
          mkdir -p "$tool_dir"
          npm install --prefix "$tool_dir" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund wrangler@4.152.0
          "$tool_dir/node_modules/.bin/wrangler" --version
          "$tool_dir/node_modules/.bin/wrangler" deploy --dry-run --config wrangler.staging.jsonc --outdir "$RUNNER_TEMP/restore-private-staging-dry-run"
          echo "Private staging pinned-Wrangler dry-run PASS, no Cloudflare API call" >> "$GITHUB_STEP_SUMMARY"

      - name: Local HTTP check of photo upload refusal and authenticated demo delivery
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          # Local-only Worker/D1/R2/Queue, synthetic non-face PNG, DEMO_MODE=true.
          # No Cloudflare account, merchant, real photo, fal or production resource.
          npm run db:migrate:smoke
          npm run dev:smoke > /tmp/restore-ai-local-smoke.log 2>&1 &
          local_pid=$!
          trap 'kill "$local_pid" 2>/dev/null || true' EXIT
          ready=0
          for try in {1..45}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8787/health > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            echo "::error::Local smoke Worker failed health check"
            tail -n 40 /tmp/restore-ai-local-smoke.log || true
            exit 1
          fi
          npm run test:smoke:local

      - name: Report scope
        if: always()
        run: |
          echo "## Restore AI OSS check" >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned candidate: \`${{ steps.source.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "No model weights downloaded; no real images, payment provider or production deployment involved." >> "$GITHUB_STEP_SUMMARY"
