name: Fortune Release Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fortune-release-deploy.yml'
      - 'config/fortune-deploy-kick.txt'
  schedule:
    - cron: '22 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fortune-release-deploy
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_INDEXING: 'false'
      PUBLIC_ENABLE_PREMIUM: 'false'
      PUBLIC_ENABLE_ANALYTICS: 'false'
      PUBLIC_ENABLE_ADS: 'false'
    steps:
      - name: Checkout runner control plane
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check required secrets
        id: secrets
        env:
          REPO_TOKEN: ${{ secrets.AUTODEV_REPO_TOKEN }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [ -n "$REPO_TOKEN" ]; then echo "repo=true" >> "$GITHUB_OUTPUT"; else echo "repo=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "cloudflare=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy credentials are configured."
          else
            echo "cloudflare=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy credentials are missing in autodev-runner; validation will run but deploy will be skipped."
          fi

      - name: Checkout validated Fortune release branch
        if: steps.secrets.outputs.repo == 'true'
        uses: actions/checkout@v4
        with:
          repository: seongjin1908/practical-calculator-factory
          ref: fortune-cloud-autopilot
          token: ${{ secrets.AUTODEV_REPO_TOKEN }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node.js
        if: steps.secrets.outputs.repo == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.secrets.outputs.repo == 'true'
        working-directory: target
        run: npm install --no-audit --no-fund

      - name: Verify release candidate
        if: steps.secrets.outputs.repo == 'true'
        working-directory: target
        run: |
          npm test
          npm run quality
          npm run build
          grep -q "Disallow: /" dist/robots.txt
          if grep -q "Allow: /" dist/robots.txt; then
            echo "Refusing preview deploy because robots allow indexing."
            exit 1
          fi

      - name: Deploy existing Fortune Cloudflare preview
        if: steps.secrets.outputs.repo == 'true' && steps.secrets.outputs.cloudflare == 'true'
        working-directory: target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Report blocked deployment
        if: steps.secrets.outputs.repo == 'true' && steps.secrets.outputs.cloudflare != 'true'
        run: |
          echo "::warning::Fortune release candidate validated, but Cloudflare deployment is blocked until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are added to autodev-runner Actions secrets."
