name: Central Zero-Budget AutoDev

# AutoDev runs only on the 30-minute timer or an explicit manual action.
# A controller source merge should run Control Plane Check, NOT re-launch costly
# stale OpenCode/Gemini batch generation.
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Project target
        required: true
        default: auto
        type: choice
        options:
          - auto
          - fortune
          - saju
          - fortune-design
          - saju-design
          - face-lab
          - face-lab-design
          - restore-ai
          - restore-ai-design
          - fault-intel
          - fault-intel-design
          - pricecam
          - saju-global
          - saju-core
          - creative-studio
          - second
          - worklink
          - cyber-guardian
          - world-patch
          - todaypick
          - jjin
          - ddd-revenue
          - ddd-rfq
          - fundos
          - motion-grid
          - tradepilot
      openrouter_free_once:
        description: Try verified zero-priced OpenRouter model for this manual run
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'saju' || inputs.target == 'saju-design' || inputs.target == 'saju-core' || inputs.target == 'saju-global') && 'saju-autodev' || 'central-zero-budget-autodev' }}
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'auto' }}
      # Expose only opt-in state, not the Gemini secret, to the OpenCode timing policy.
      AUTODEV_GEMINI_FREE_ENABLED: ${{ vars.AUTODEV_GEMINI_FREE_ENABLED || 'false' }}
      DDD_FREE_CODE_MODEL_PRIMARY: ${{ vars.DDD_FREE_CODE_MODEL_PRIMARY || 'opencode/space-bunny-free' }}
      DDD_FREE_CODE_MODEL_SECONDARY: ${{ vars.DDD_FREE_CODE_MODEL_SECONDARY || 'opencode/longcat-2.5-preview-free' }}
      DDD_FREE_CODE_MODEL_TERTIARY: ${{ vars.DDD_FREE_CODE_MODEL_TERTIARY || 'opencode/nemotron-3.5-lightning-free' }}
      DDD_FREE_CODE_MODEL_QUATERNARY: ${{ vars.DDD_FREE_CODE_MODEL_QUATERNARY || 'opencode/ling-3.0-flash-fin-free' }}
      DDD_FREE_CODE_MODEL_QUINARY: ${{ vars.DDD_FREE_CODE_MODEL_QUINARY || 'opencode/laguna-s-2.1-free' }}
      DDD_FREE_CODE_MODEL_SENARY: ${{ vars.DDD_FREE_CODE_MODEL_SENARY || 'opencode/mimo-v2.6-flash-free' }}
      DDD_FREE_MODEL_TIMEOUT_SECONDS: ${{ vars.DDD_FREE_MODEL_TIMEOUT_SECONDS || '300' }}
      DDD_FREE_MODEL_TRANSIENT_RETRIES: ${{ vars.DDD_FREE_MODEL_TRANSIENT_RETRIES || '0' }}
      # Explicit one-off manual opt-in fast-skips unavailable legacy provider pool.
      # This does not change cron defaults or enable recurring OpenRouter use.
      DDD_FREE_MODEL_POOL_MAX_SECONDS: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.openrouter_free_once == true)) && '1' || vars.DDD_FREE_MODEL_POOL_MAX_SECONDS || '' }}
      AUTODEV_ROTATION_SLOT_SECONDS: '1800'
      # Default scheduled and manual coding to the bounded, already proven $0 API.
      AUTODEV_DIRECT_FREE_ONLY: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}

    steps:
      - name: Checkout runner control plane
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify private-target preflight behavior offline
        shell: bash
        run: bash tests/test_preflight_cyber.sh

      - name: Select target
        id: select
        env:
          GH_TOKEN: ${{ secrets.AUTODEV_REPO_TOKEN }}
        shell: bash
        run: bash scripts/select_target.sh

      - name: Check repository token
        id: token
        env:
          AUTODEV_REPO_TOKEN: ${{ secrets.AUTODEV_REPO_TOKEN }}
        shell: bash
        run: |
          if [ -n "$AUTODEV_REPO_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AUTODEV_REPO_TOKEN is not configured. No private repository will be touched."
          fi

      - name: Verify selected target repository access
        id: target_access
        if: steps.token.outputs.configured == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AUTODEV_REPO_TOKEN }}
          REPOSITORY: ${{ steps.select.outputs.repository }}
          CHECKOUT_BRANCH: ${{ steps.select.outputs.checkout_branch }}
        shell: bash
        run: |
          set -euo pipefail
          push_allowed="$(gh api "repos/$REPOSITORY" --jq '.permissions.push // false')"
          gh api "repos/$REPOSITORY/git/ref/heads/$CHECKOUT_BRANCH" --jq .object.sha >/dev/null
          if [ "$push_allowed" != "true" ]; then
            echo "::error::AUTODEV_REPO_TOKEN cannot push to $REPOSITORY."
            exit 15
          fi
          echo "Target repository access verified."

      - name: Verify Cyber Guardian allowlist and source contract
        id: cyber_access
        if: steps.select.outputs.alias == 'cyber-guardian' && steps.target_access.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AUTODEV_REPO_TOKEN }}
          ALIAS: ${{ steps.select.outputs.alias }}
          REPOSITORY: ${{ steps.select.outputs.repository }}
          CHECKOUT_BRANCH: ${{ steps.select.outputs.checkout_branch }}
        shell: bash
        run: bash scripts/preflight_target_access.sh

      - name: Hold inaccessible private target without stopping the portfolio
        if: steps.token.outputs.configured == 'true' && (steps.target_access.outcome == 'failure' || (steps.select.outputs.alias == 'cyber-guardian' && steps.cyber_access.outcome == 'failure'))
        shell: bash
        run: |
          echo "SKIP_TARGET=true" >> "$GITHUB_ENV"
          echo "AUTODEV_SKIP_REASON=private_repo_permission" >> "$GITHUB_ENV"
          echo "::warning::Selected target is safely held because repository access is unavailable. Other projects continue normally."

      - name: Checkout target work branch
        if: steps.token.outputs.configured == 'true' && steps.target_access.outcome == 'success' && env.SKIP_TARGET != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.select.outputs.repository }}
          ref: ${{ steps.select.outputs.checkout_branch }}
          token: ${{ secrets.AUTODEV_REPO_TOKEN }}
          path: target
          fetch-depth: ${{ steps.select.outputs.branch_mode == 'run_scoped' && 1 || 0 }}
          persist-credentials: false

      - name: Restore PUBLIC coding CLI download cache
        # Critical: NEVER cache ~/.npm, target deps, or private source in this public controller.
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/autodev-public-cli-npm-cache
          key: public-cli-npm-v1-${{ runner.os }}

      - name: Prepare collision and failure-hold guard
        if: steps.token.outputs.configured == 'true' && env.SKIP_TARGET != 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTODEV_REPO_TOKEN }}
          REPOSITORY: ${{ steps.select.outputs.repository }}
          WORK_BRANCH: ${{ steps.select.outputs.work_branch }}
          BASE_BRANCH: ${{ steps.select.outputs.base_branch }}
          BRANCH_MODE: ${{ steps.select.outputs.branch_mode }}
          MAX_BRANCH_AHEAD: ${{ steps.select.outputs.max_branch_ahead }}
          RECENT_CHANGE_GUARD_MINUTES: ${{ steps.select.outputs.recent_change_guard_minutes }}
          FAILURE_HOLD_THRESHOLD: ${{ steps.select.outputs.failure_hold_threshold }}
          FAILURE_HOLD_MINUTES: ${{ steps.select.outputs.failure_hold_minutes }}
          EXTERNAL_WORKER_LOCK: ${{ steps.select.outputs.external_worker_lock }}
          EXTERNAL_WORKER_OWNER: ${{ steps.select.outputs.external_worker_owner }}
          EXTERNAL_WORKER_SCOPE: ${{ steps.select.outputs.external_worker_scope }}
        shell: bash
        run: bash scripts/prepare_target.sh

      - name: Execute guarded zero-budget batch
        if: steps.token.outputs.configured == 'true' && env.SKIP_TARGET != 'true'
        env:
          ALIAS: ${{ steps.select.outputs.alias }}
          VALIDATION_B64: ${{ steps.select.outputs.validation_b64 }}
          PROMPT_FILE: ${{ steps.select.outputs.prompt_file }}
          MAX_CHANGED_FILES: ${{ steps.select.outputs.max_changed_files }}
          DDD_FREE_MODEL_TRANSIENT_RETRIES: ${{ env.DDD_FREE_MODEL_TRANSIENT_RETRIES }}
        shell: bash
        run: bash scripts/develop_target.sh

      - name: Optional strictly zero-priced OpenRouter direct coding (manual or bounded schedule)
        # Every 30 min: at most 48 scheduled calls/day. Manual explicit retry only.
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && steps.token.outputs.configured == 'true' && env.SKIP_TARGET != 'true' && env.BATCH_READY != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.AUTODEV_OPENROUTER_FREE_API_KEY }}
          AUTODEV_OPENROUTER_FREE_ENABLED: 'true'
          AUTODEV_OPENROUTER_FREE_MODEL: ${{ vars.AUTODEV_OPENROUTER_FREE_MODEL || 'openrouter/minimax/minimax-m3.1-flash:free' }}
          AUTODEV_OPENROUTER_DIRECT_FIRST: 'true'
          AUTODEV_OPENROUTER_RETRY_ONCE: ${{ github.event_name == 'workflow_dispatch' && inputs.openrouter_free_once == true && 'true' || 'false' }}
          VALIDATION_B64: ${{ steps.select.outputs.validation_b64 }}
          MAX_CHANGED_FILES: ${{ steps.select.outputs.max_changed_files }}
          ALIAS: ${{ steps.select.outputs.alias }}
        shell: bash
        run: bash scripts/openrouter_free_fallback.sh

      - name: Optional independent Gemini free-tier coding fallback
        if: steps.token.outputs.configured == 'true' && env.SKIP_TARGET != 'true' && env.BATCH_READY != 'true' && vars.AUTODEV_GEMINI_FREE_ENABLED == 'true' && !(github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          # Never pass Gemini credentials to OpenCode, npm baseline, or other steps.
          GEMINI_API_KEY: ${{ secrets.AUTODEV_GEMINI_FREE_API_KEY }}
          AUTODEV_GEMINI_FREE_ENABLED: ${{ vars.AUTODEV_GEMINI_FREE_ENABLED }}
          ALIAS: ${{ steps.select.outputs.alias }}
          VALIDATION_B64: ${{ steps.select.outputs.validation_b64 }}
          MAX_CHANGED_FILES: ${{ steps.select.outputs.max_changed_files }}
        shell: bash
        run: bash scripts/gemini_free_fallback.sh
      - name: Preserve privacy-safe free model outcome scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-model-scorecard-${{ github.run_id }}-${{ github.job }}
          path: ${{ runner.temp }}/autodev-model-metrics.jsonl
          if-no-files-found: ignore
          retention-days: 3

      - name: Report private diagnostics
        if: always() && steps.token.outputs.configured == 'true' && env.SKIP_TARGET != 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTODEV_REPO_TOKEN }}
          REPOSITORY: ${{ steps.select.outputs.repository }}
          WORK_BRANCH: ${{ steps.select.outputs.work_branch }}
          BASE_BRANCH: ${{ steps.select.outputs.base_branch }}
          ALIAS: ${{ steps.select.outputs.alias }}
          FAILURE_HOLD_THRESHOLD: ${{ steps.select.outputs.failure_hold_threshold }}
          FAILURE_HOLD_MINUTES: ${{ steps.select.outputs.failure_hold_minutes }}
        shell: bash
        run: bash scripts/report_target.sh


      - name: Require validated code production
        # An unavailable free model is an expected provider failure, not a successful development run.
        # Do not count deliberate collision/permission HOLD as a development attempt.
        if: always() && steps.token.outputs.configured == 'true' && env.SKIP_TARGET != 'true'
        shell: bash
        run: bash scripts/require_production_batch.sh

      - name: Push validated batch and maintain PR
        if: steps.token.outputs.configured == 'true' && env.SKIP_TARGET != 'true' && env.BATCH_READY == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTODEV_REPO_TOKEN }}
          REPOSITORY: ${{ steps.select.outputs.repository }}
          WORK_BRANCH: ${{ steps.select.outputs.work_branch }}
          BASE_BRANCH: ${{ steps.select.outputs.base_branch }}
          ALIAS: ${{ steps.select.outputs.alias }}
        shell: bash
        run: bash scripts/push_target.sh
