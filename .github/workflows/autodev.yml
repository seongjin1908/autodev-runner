name: Central Zero-Budget AutoDev

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Project target
        required: true
        default: auto
        type: choice
        options:
          - auto
          - fortune
          - saju
          - pricecam
          - face-lab
          - restore-ai

permissions:
  contents: read

concurrency:
  group: central-zero-budget-autodev
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      AUTODEV_REPO_TOKEN: ${{ secrets.AUTODEV_REPO_TOKEN }}
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'auto' }}
      DDD_FREE_CODE_MODEL_PRIMARY: ${{ vars.DDD_FREE_CODE_MODEL_PRIMARY || 'opencode/north-mini-code-free' }}
      DDD_FREE_CODE_MODEL_SECONDARY: ${{ vars.DDD_FREE_CODE_MODEL_SECONDARY || 'opencode/deepseek-v4-flash-free' }}
      DDD_FREE_CODE_MODEL_TERTIARY: ${{ vars.DDD_FREE_CODE_MODEL_TERTIARY || 'opencode/big-pickle' }}

    steps:
      - name: Checkout runner control plane
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$AUTODEV_REPO_TOKEN" ]; then
            echo "AUTODEV_REPO_TOKEN is missing. Add the fine-grained token secret; no target repository was touched."
            exit 0
          fi
          gh --version
          node --version
          python --version

      - name: Execute one guarded development batch
        if: env.AUTODEV_REPO_TOKEN != ''
        shell: bash
        run: bash scripts/run_target.sh
