name: Central Zero-Budget AutoDev

on:
  push:
    branches: [main]
    paths:
      - 'config/projects.json'
      - 'prompts/**'
      - 'scripts/**'
      - '.github/workflows/autodev.yml'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Project target
        required: true
        default: auto
        type: choice
        options:
          - auto
          - fortune
          - saju
          - fortune-design
          - saju-design
          - face-lab
          - face-lab-design
          - restore-ai
          - restore-ai-design
          - fault-intel
          - fault-intel-design
          - pricecam
          - saju-global
          - saju-core
          - creative-studio
          - second
          - cyber-guardian
          - world-patch
          - todaypick
          - jjin
          - ddd-revenue
          - ddd-rfq
          - fundos
          - motion-grid
          - tradepilot

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'saju' || inputs.target == 'saju-design' || inputs.target == 'saju-core' || inputs.target == 'saju-global') && 'saju-autodev' || 'central-zero-budget-autodev' }}
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'auto' }}
      DDD_FREE_CODE_MODEL_PRIMARY: ${{ vars.DDD_FREE_CODE_MODEL_PRIMARY || 'opencode/mimo-v2.6-flash-free' }}
      DDD_FREE_CODE_MODEL_SECONDARY: ${{ vars.DDD_FREE_CODE_MODEL_SECONDARY || 'opencode/longcat-2.5-preview-free' }}
      DDD_FREE_CODE_MODEL_TERTIARY: ${{ vars.DDD_FREE_CODE_MODEL_TERTIARY || 'opencode/nemotron-3.5-lightning-free' }}
      DDD_FREE_CODE_MODEL_QUATERNARY: ${{ vars.DDD_FREE_CODE_MODEL_QUATERNARY || 'opencode/ling-3.0-flash-fin-free' }}
      DDD_FREE_CODE_MODEL_QUINARY: ${{ vars.DDD_FREE_CODE_MODEL_QUINARY || 'opencode/laguna-s-2.1-free' }}
      DDD_FREE_CODE_MODEL_SENARY: ${{ vars.DDD_FREE_CODE_MODEL_SENARY || 'opencode/space-bunny-free' }}
      DDD_FREE_MODEL_TIMEOUT_SECONDS: ${{ vars.DDD_FREE_MODEL_TIMEOUT_SECONDS || '300' }}
      DDD_FREE_MODEL_TRANSIENT_RETRIES: ${{ vars.DDD_FREE_MODEL_TRANSIENT_RETRIES || '1' }}
      AUTODEV_ROTATION_SLOT_SECONDS: '1800'

    steps:
      - name: Checkout runner control plane
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify private-target preflight behavior offline
        shell: bash
        run: bash tests/test_preflight_cyber.sh

      - name: Select target
        id: select
        env:
          GH_TOKEN: ${{ secrets.AUTODEV_REPO_TOKEN }}
        shell: bash
        run: bash scripts/select_target.sh

      - name: Check repository token
        id: token
        env:
          AUTODEV_REPO_TOKEN: ${{ secrets.AUTODEV_REPO_TOKEN }}
        shell: bash
        run: |
          if [ -n "$AUTODEV_REPO_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AUTODEV_REPO_TOKEN is not configured. No private repository will be touched."
          fi

      - name: Verify selected target repository access
        id: target_access
        if: steps.token.outputs.configured == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AUTODEV_REPO_TOKEN }}
          REPOSITORY: ${{ steps.select.outputs.repository }}
          CHECKOUT_BRANCH: ${{ steps.select.outputs.checkout_branch }}
        shell: bash
        run: |
          set -euo pipefail
          push_allowed="$(gh api "repos/$REPOSITORY" --jq '.permissions.push // false')"
          gh api "repos/$REPOSITORY/git/ref/heads/$CHECKOUT_BRANCH" --jq .object.sha >/dev/null
          if [ "$push_allowed" != "true" ]; then
            echo "::error::AUTODEV_REPO_TOKEN cannot push to $REPOSITORY."
            exit 15
          fi
          echo "Target repository access verified."

      - name: Verify Cyber Guardian allowlist and source contract
        id: cyber_access
        if: steps.select.outputs.alias == 'cyber-guardian' && steps.target_access.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AUTODEV_REPO_TOKEN }}
          ALIAS: ${{ steps.select.outputs.alias }}
          REPOSITORY: ${{ steps.select.outputs.repository }}
          CHECKOUT_BRANCH: ${{ steps.select.outputs.checkout_branch }}
        shell: bash
        run: bash scripts/preflight_target_access.sh

      - name: Hold inaccessible private target without stopping the portfolio
        if: steps.token.outputs.configured == 'true' && (steps.target_access.outcome == 'failure' || (steps.select.outputs.alias == 'cyber-guardian' && steps.cyber_access.outcome == 'failure'))
        shell: bash
        run: |
          echo "SKIP_TARGET=true" >> "$GITHUB_ENV"
          echo "AUTODEV_SKIP_REASON=private_repo_permission" >> "$GITHUB_ENV"
          echo "::warning::Selected target is safely held because repository access is unavailable. Other projects continue normally."

      - name: Checkout target work branch
        if: steps.token.outputs.configured == 'true' && steps.target_access.outcome == 'success' && env.SKIP_TARGET != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.select.outputs.repository }}
          ref: ${{ steps.select.outputs.checkout_branch }}
          token: ${{ secrets.AUTODEV_REPO_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare collision and failure-hold guard
        if: steps.token.outputs.configured == 'true' && env.SKIP_TARGET != 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTODEV_REPO_TOKEN }}
          REPOSITORY: ${{ steps.select.outputs.repository }}
          WORK_BRANCH: ${{ steps.select.outputs.work_branch }}
          BASE_BRANCH: ${{ steps.select.outputs.base_branch }}
          BRANCH_MODE: ${{ steps.select.outputs.branch_mode }}
          MAX_BRANCH_AHEAD: ${{ steps.select.outputs.max_branch_ahead }}
          RECENT_CHANGE_GUARD_MINUTES: ${{ steps.select.outputs.recent_change_guard_minutes }}
          FAILURE_HOLD_THRESHOLD: ${{ steps.select.outputs.failure_hold_threshold }}
          FAILURE_HOLD_MINUTES: ${{ steps.select.outputs.failure_hold_minutes }}
        shell: bash
        run: bash scripts/prepare_target.sh

      - name: Execute guarded zero-budget batch
        if: steps.token.outputs.configured == 'true' && env.SKIP_TARGET != 'true'
        env:
          ALIAS: ${{ steps.select.outputs.alias }}
          VALIDATION_B64: ${{ steps.select.outputs.validation_b64 }}
          PROMPT_FILE: ${{ steps.select.outputs.prompt_file }}
          MAX_CHANGED_FILES: ${{ steps.select.outputs.max_changed_files }}
          DDD_FREE_MODEL_TRANSIENT_RETRIES: ${{ env.DDD_FREE_MODEL_TRANSIENT_RETRIES }}
        shell: bash
        run: bash scripts/develop_target.sh

      - name: Report private diagnostics
        if: always() && steps.token.outputs.configured == 'true' && env.SKIP_TARGET != 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTODEV_REPO_TOKEN }}
          REPOSITORY: ${{ steps.select.outputs.repository }}
          WORK_BRANCH: ${{ steps.select.outputs.work_branch }}
          BASE_BRANCH: ${{ steps.select.outputs.base_branch }}
          ALIAS: ${{ steps.select.outputs.alias }}
          FAILURE_HOLD_THRESHOLD: ${{ steps.select.outputs.failure_hold_threshold }}
          FAILURE_HOLD_MINUTES: ${{ steps.select.outputs.failure_hold_minutes }}
        shell: bash
        run: bash scripts/report_target.sh

      - name: Push validated batch and maintain PR
        if: steps.token.outputs.configured == 'true' && env.SKIP_TARGET != 'true' && env.BATCH_READY == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTODEV_REPO_TOKEN }}
          REPOSITORY: ${{ steps.select.outputs.repository }}
          WORK_BRANCH: ${{ steps.select.outputs.work_branch }}
          BASE_BRANCH: ${{ steps.select.outputs.base_branch }}
          ALIAS: ${{ steps.select.outputs.alias }}
        shell: bash
        run: bash scripts/push_target.sh
