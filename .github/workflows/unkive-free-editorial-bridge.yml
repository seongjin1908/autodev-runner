name: UNKIVE PR162 free editorial verification

on:
  pull_request:
    paths:
      - '.github/workflows/unkive-free-editorial-bridge.yml'
      - 'config/unkive-p0-ci-ref.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unkive-free-editorial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-free:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout runner control plane
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read pinned UNKIVE ref
        id: target
        shell: bash
        run: |
          set -euo pipefail
          ref="$(tr -d '\r\n' < config/unkive-p0-ci-ref.txt)"
          if ! [[ "$ref" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Expected pinned 40-character commit SHA"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned UNKIVE source read-only
        uses: actions/checkout@v4
        with:
          repository: seongjin1908/daangn-saju-autodev
          ref: ${{ steps.target.outputs.ref }}
          token: ${{ secrets.AUTODEV_REPO_TOKEN }}
          path: target
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install existing dependencies without lifecycle hooks
        working-directory: target
        run: npm install --no-package-lock --no-audit --no-fund --ignore-scripts

      - name: Verify free chart grounding and eight-interest editorial quality
        working-directory: target
        run: node scripts/check-unkive-free-editorial.mjs
