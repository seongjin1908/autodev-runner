name: SECOND release candidate verification

on:
  pull_request:
    paths:
      - '.github/workflows/second-rc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact SECOND release candidate
        uses: actions/checkout@v4
        with:
          repository: seongjin1908/second-work
          ref: d0de4ae06c8477a42a0b73344ffa657cd85eec15
          token: ${{ secrets.AUTODEV_REPO_TOKEN }}
          path: target
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: target
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Verify tests contract
        working-directory: target
        run: node -e "JSON.parse(require('fs').readFileSync('tests/tests.json','utf8'))"
      - name: Domain tests
        working-directory: target
        run: npm test
      - name: Typecheck
        working-directory: target
        run: npm run typecheck
      - name: Build
        working-directory: target
        run: npm run build
