name: WORKLINK free-source AutoDev dispatch

# Runs only on the owner's public control plane. Dispatch alone is NOT a code change.
# Public Actions has no paid AI key; target worker uses only the configured free model pool.
on:
  schedule:
    - cron: '09 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: worklink-free-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'seongjin1908/autodev-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Dispatch existing guarded zero-budget worker for WORKLINK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run autodev.yml --repo "$GITHUB_REPOSITORY" --ref main -f target=worklink
          echo "WORKLINK worker dispatch submitted. NOT evidence that an AI model generated code."
          echo "Only commits plus passing source tests plus a linked PR qualify as development."
