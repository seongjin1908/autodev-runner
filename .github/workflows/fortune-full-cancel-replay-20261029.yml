name: One-shot Fortune authenticated full cancellation replay test
on:
  push:
    branches: [test/fortune-full-cancel-replay-20261029]
    paths:
      - .github/workflows/fortune-full-cancel-replay-20261029.yml
  pull_request:
    paths:
      - .github/workflows/fortune-full-cancel-replay-20261029.yml
permissions:
  contents: read
jobs:
  fortune-full-cancel-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          repository: seongjin1908/ddd-revenue-os
          ref: ff952f135039cb31bf72397a93c94b0910931dd3
          token: ${{ secrets.AUTODEV_REPO_TOKEN }}
          persist-credentials: false
          path: hub
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actual merchant TS bridge mock + Partner Hub isolated regression
        working-directory: hub/partner-hub
        run: npm run check
      - name: Verify payout and referral activation OFF
        working-directory: hub/partner-hub
        run: |
          grep -Fx 'PARTNER_REFERRALS_ENABLED=NO' .env.example
          grep -Fx 'ALLOW_MANUAL_PAYOUT=NO' .env.example
          grep -F 'cashPayoutEnabled: false' integrations/appdeploy/fortune-affiliate.ts
