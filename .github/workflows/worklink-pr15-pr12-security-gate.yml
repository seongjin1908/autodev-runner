name: WORKLINK isolated PR15 and PR12 security gates
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/worklink-pr15-pr12-security-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worklink-isolated-20261022
  cancel-in-progress: true
jobs:
  pilot-loopback:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: WORKLINK PR15 exact-commit loopback and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require existing private source checkout permission
        env:
          REPO_TOKEN: ${{ secrets.AUTODEV_REPO_TOKEN }}
        run: test -n "$REPO_TOKEN"
      - name: Checkout exact PR15 source read-only
        uses: actions/checkout@v4
        with:
          repository: seongjin1908/worklink
          ref: 06d3f3b3f9578f65e4e63cace9f731bc30e7565c
          token: ${{ secrets.AUTODEV_REPO_TOKEN }}
          persist-credentials: false
          path: worklink-pr15
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Assert committed source and fail-closed tests
        working-directory: worklink-pr15
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "06d3f3b3f9578f65e4e63cace9f731bc30e7565c"
          node --check server/serve.mjs
          node --check server/pilot-host-policy.mjs
          if ! node --test --test-reporter=tap tests/pilot-host-policy.test.mjs > /tmp/wl15-policy.log 2>&1; then
            echo 'PR15 committed host-policy test failure (synthetic fixtures only):'
            tail -n 45 /tmp/wl15-policy.log
            exit 1
          fi
          grep -E '^# (tests|pass|fail|skipped)' /tmp/wl15-policy.log
          grep -Eq '# pass 3$' /tmp/wl15-policy.log
          grep -Eq '# fail 0$' /tmp/wl15-policy.log
          echo 'WORKLINK PR15 three pilot-host tests: PASS'
      - name: Original tests plus patched build
        working-directory: worklink-pr15
        env:
          npm_config_ignore_scripts: 'true'
        run: |
          set -euo pipefail
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund > /tmp/wl15-install.log 2>&1
          node --test --test-reporter=tap tests/*.test.mjs > /tmp/wl15-tests.log 2>&1 || { echo 'WORKLINK full tests FAIL'; tail -n 25 /tmp/wl15-tests.log; exit 1; }
          grep -Eq '^# fail 0$' /tmp/wl15-tests.log
          grep -Eq '^# skipped 0$' /tmp/wl15-tests.log
          npm run typecheck > /tmp/wl15-typecheck.log 2>&1 || { echo 'WORKLINK typecheck FAIL'; exit 1; }
          npm run build > /tmp/wl15-build.log 2>&1 || { echo 'WORKLINK build FAIL'; exit 1; }
          echo 'WORKLINK PR15 full Node tests/typecheck/build: PASS, no skips'
      - name: Scope report
        run: |
          echo 'Verified only pinned WORKLINK PR15 source in an ephemeral runner; private logs not uploaded.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No merge, live users, real payments, deployment or model API calls.' >> "$GITHUB_STEP_SUMMARY"
  manual-reviewer:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: WORKLINK PR12 reviewer identity exact-commit gate
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout pinned PR12 source
        uses: actions/checkout@v4
        with:
          repository: seongjin1908/worklink
          ref: 819c62eb422db7baf56f7bd73df15803721206d5
          token: ${{ secrets.AUTODEV_REPO_TOKEN }}
          persist-credentials: false
          path: worklink-pr12
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Review exact optional-free manual reviewer guard
        working-directory: worklink-pr12
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "819c62eb422db7baf56f7bd73df15803721206d5"
          node --check server/operator.mjs
          node --input-type=commonjs - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const src = fs.readFileSync('server/operator.mjs','utf8');
          assert(src.includes("process.env.WORKLINK_REVIEWER_ACK!=='I_REVIEWED_EVIDENCE'"));
          assert(src.includes('process.env.WORKLINK_REVIEWER_ID?.trim()'));
          assert(src.includes('if(!reviewer) throw Error('));
          assert(src.includes('recordManualVerification(db,{kind,userId,evidenceRef,jobId,reviewer})'));
          assert(!src.includes("||'pilot-operator'"));
          console.log('WORKLINK PR12 nonempty named human reviewer guard PASS');
          NODE
      - name: Scope report
        run: |
          echo 'PR12 exact reviewed 1-file patch: syntax and named reviewer boundary PASS.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Duplicate PR16 is not part of this gate; no merge/deploy/real verification data.' >> "$GITHUB_STEP_SUMMARY"
 /tmp/wl15-tests.log
          grep -Eq '^# skipped 0
          npm run typecheck > /tmp/wl15-typecheck.log 2>&1 || { echo 'WORKLINK typecheck FAIL'; exit 1; }
          npm run build > /tmp/wl15-build.log 2>&1 || { echo 'WORKLINK build FAIL'; exit 1; }
          echo 'WORKLINK PR15 full Node tests/typecheck/build: PASS, no skips'
      - name: Scope report
        run: |
          echo 'Verified only pinned WORKLINK PR15 source in an ephemeral runner; private logs not uploaded.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No merge, live users, real payments, deployment or model API calls.' >> "$GITHUB_STEP_SUMMARY"
